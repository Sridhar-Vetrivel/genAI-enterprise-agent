name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # lets the opt-in `live` job be triggered by hand

# A newer push to the same ref cancels the in-progress run — no stacked, wasted runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project targets 3.11+; dev runs on 3.12. Test both so a version-specific
        # regression fails CI instead of surfacing on someone's machine.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check psiog_kendra agents tests

      - name: Format check
        run: ruff format --check psiog_kendra agents tests

      # Fully offline: no Ollama, no control plane, no network. The --live tests are exercised
      # by the separate, opt-in `live` job below. Gate hard on coverage (proposal target ≥80%).
      - name: Test with coverage (>=80% required)
        run: >
          pytest --cov=psiog_kendra
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # The copilot's real inference path is the local model — OpenRouter is permanently not
  # provisioned, so `pytest --live` against Ollama IS the integration test, not a stand-in for
  # a hosted endpoint. It runs gemma3:4b on a CPU-only runner, which is slow (~15–30 min) and
  # too heavy to gate every push on, so it is OPT-IN: trigger it by hand from the Actions tab
  # (Run workflow) when model-facing code changes. It never blocks a PR.
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 1
          done

      - name: Pull the models the live tests need
        run: |
          ollama pull gemma3:4b
          ollama pull gemma3:1b
          ollama pull nomic-embed-text

      - name: Live tests (real local models)
        run: pytest --live -m live -v
